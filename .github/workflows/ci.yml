name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify client bundle
        run: node scripts/verify-bundle.mjs
      - name: Unit tests
        run: node scripts/run-tests.mjs
      - name: Package check
        run: node scripts/verify-pack.mjs
